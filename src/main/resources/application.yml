spring:
  application:
    name: staysync
  profiles:
    default: local
  jpa:
    open-in-view: false          # 지연 로딩이 컨트롤러까지 새어나가지 않게 한다
    hibernate:
      ddl-auto: validate         # 스키마는 Flyway 가 관리한다
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql   # 두 프로파일 모두 PostgreSQL 이다
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

staysync:
  timezone: Asia/Seoul
  hold-expiry-minutes: 15        # 직접예약 HOLD 유지 시간
  security:
    jwt:
      # 서명 키는 저장소에 두지 않는다. 환경 변수로 주입한다 (.env.example 참고).
      # 기본값을 비워 두었으므로 값이 없으면 기동 시점에 실패한다. 첫 로그인 요청까지
      # 문제가 미뤄지는 것보다 낫다. local 프로파일만 개발용 고정값으로 덮어쓴다.
      secret: ${JWT_SECRET:}
      issuer: staysync
      access-token-ttl: 30m      # 계획서 15.1
      refresh-token-ttl: 14d     # 계획서 15.1
    cookie:
      # 리프레시 토큰 쿠키의 Secure 속성. 운영 기본값은 켜 둔다.
      # local 프로파일만 끈다. HTTPS 가 아니면 브라우저가 쿠키를 저장하지 않는다.
      secure: true
    crypto:
      # 게스트 연락처 암호화 키. JWT_SECRET 과 같이 저장소에 두지 않는다.
      # 값이 없으면 기동에 실패한다. local 프로파일만 개발용 고정값을 덮어쓴다.
      master-key: ${GUEST_DATA_KEY:}
  ical:
    poll-interval-minutes: 15
    shrink-guard-ratio: 0.5      # 이벤트 수가 직전의 절반 이하로 줄면 취소 처리를 보류

logging:
  level:
    com.staysync: DEBUG
