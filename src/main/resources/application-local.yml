# Docker 없이 실행하는 개발용 프로파일.
# zonky embedded-postgres 가 실제 PostgreSQL 바이너리를 내려받아 직접 구동한다.
# 최초 실행 시 바이너리 다운로드로 1~2분이 걸릴 수 있다.

staysync:
  embedded-postgres:
    enabled: true
    port: 15432
    data-directory: .localdb     # .gitignore 에 포함되어 있다
    # 기동할 때마다 데이터 디렉터리를 새로 만든다.
    # 스키마가 자주 바뀌는 지금은 켜 두는 편이 편하다. 마이그레이션이 바뀌어도
    # Flyway 체크섬 오류가 나지 않고 resetLocalDb 를 부를 일도 없다.
    # 스키마가 안정되고 시드 데이터를 유지하고 싶어지면(P2 무렵) false 로 바꾼다.
    clean-on-start: true
  lock:
    type: local                  # JVM 내부 락 (단일 인스턴스 전제)
  vector:
    type: in-memory              # pgvector 없이 메모리에서 코사인 유사도 계산
                                 # 내장 PostgreSQL 바이너리에는 pgvector 가 없다.
                                 # 임베딩은 REAL[] 컬럼에 저장하고 Java 에서 계산한다.

spring:
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
