# Docker 없이 실행하는 개발용 프로파일.
# zonky embedded-postgres 가 실제 PostgreSQL 바이너리를 내려받아 직접 구동한다.
# 최초 실행 시 바이너리 다운로드로 1~2분이 걸릴 수 있다.

staysync:
  embedded-postgres:
    enabled: true
    port: 15432
    data-directory: .localdb     # .gitignore 에 포함되어 있다
    # 기동할 때마다 데이터 디렉터리를 새로 만든다.
    # 스키마가 자주 바뀌는 지금은 켜 두는 편이 편하다. 마이그레이션이 바뀌어도
    # Flyway 체크섬 오류가 나지 않고 resetLocalDb 를 부를 일도 없다.
    # 스키마가 안정되고 시드 데이터를 유지하고 싶어지면(P2 무렵) false 로 바꾼다.
    clean-on-start: true
  lock:
    type: local                  # JVM 내부 락 (단일 인스턴스 전제)
  security:
    jwt:
      # 개발 전용 고정 키. 이 값이 공개되어 있다는 전제로만 쓴다.
      # 고정값이라 재기동해도 액세스 토큰이 그대로 유효하다. 매번 난수를 만들면
      # 앱을 띄울 때마다 다시 로그인해야 해서 개발이 번거로워진다.
      #
      # 다만 위 clean-on-start 가 켜져 있어 기동할 때마다 데이터베이스가 비워진다.
      # refresh_token 행과 user_account 행이 함께 사라지므로, 살아남은 액세스 토큰이
      # 가리키는 사용자는 더 이상 존재하지 않는다. 재기동 후에는 다시 로그인해야 한다.
      # local 에서만 그렇고, docker 나 운영에서는 토큰이 재기동을 넘어 유지된다.
      secret: local-development-only-secret-key-do-not-use-in-production
  vector:
    type: in-memory              # pgvector 없이 메모리에서 코사인 유사도 계산
                                 # 내장 PostgreSQL 바이너리에는 pgvector 가 없다.
                                 # 임베딩은 REAL[] 컬럼에 저장하고 Java 에서 계산한다.

spring:
  jpa:
    show-sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
