# 배포 프로파일. 작업지시-15 2절 D. deploy/compose.yml 이 SPRING_PROFILES_ACTIVE=prod 로 띄운다.
#
# 시크릿(JWT_SECRET, GUEST_DATA_KEY, POSTGRES_PASSWORD, PORTONE_*)은 여기 없다.
# application.yml 의 ${...} 자리로 서버의 .env 가 들어간다. 비어 있으면 기동이 막힌다 —
# local 프로파일의 고정값이 배포로 새는 것을 그 실패가 막는다.
#
# security.cookie.secure 는 application.yml 의 기본값 true 를 그대로 쓴다.

staysync:
  embedded-postgres:
    enabled: false
  lock:
    # Redis 구현이 없다. 이 키를 읽는 코드도 없어서 값은 문서 역할이다 — 앱이
    # 한 컨테이너뿐이라 JVM 락으로 충분하다. 인스턴스를 늘리면 그때 Redis 가 필요하다.
    type: local
  public-base-url: ${PUBLIC_BASE_URL}

spring:
  flyway:
    # pgvector 가 실제로 있는 첫 환경이다. V2 를 포함해야 knowledge_chunk 가 vector 타입이 된다.
    locations:
      - classpath:db/migration/postgresql
      - classpath:db/migration/pgvector
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      # 커넥션 하나에 PostgreSQL 백엔드 프로세스가 하나 붙는다. 2GB 에서는 10 이다(4절).
      maximum-pool-size: 10

logging:
  level:
    com.staysync: INFO
