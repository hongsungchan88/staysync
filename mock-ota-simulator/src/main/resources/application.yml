# Mock OTA 시뮬레이터 설정.
#
# 이 파일은 staysync 백엔드의 설정과 아무 관계가 없다. .env 도 읽지 않는다 —
# 실제 Channex 키와 무관하고, 여기의 키는 시뮬레이터 자신의 설정이다.

server:
  # 8080(백엔드), 15432·15433·15434(내장 PostgreSQL), 5173(프론트) 를 피한다.
  port: 8081

spring:
  application:
    name: mock-ota-simulator
  jackson:
    # 우리 API 는 camelCase 다. 여기를 snake_case 로 두는 것은 취향이 아니라
    # 검증 장치다 — 이름이 우연히 맞아떨어져 통과하면 12주차 어댑터가 정말로
    # 매핑을 하는지 알 수 없다. 상용 채널 매니저들의 형식이기도 하다.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mockota:
  # 검사할 값이 있으면 되고, 무엇이든 상관없다. 서명이나 만료를 흉내 내지 않는다.
  api-key: mock-ota-dev-key
  # 예약이 생기면 여기로 POST 한다. 비어 있으면 보내지 않는다.
  # 우리 앱의 수신 엔드포인트는 12~13주차라 기본값은 비워 둔다.
  webhook-url: ""
  chaos:
    latency-ms: 0
    error-rate: 0.0
    # 시드를 지정하면 실패 순서가 재현된다. 비우면 매번 새로 뽑고 기동 로그에 남긴다.
    # seed: 42

logging:
  level:
    com.mockota: DEBUG
