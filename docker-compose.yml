# docker 프로파일용 구성. local 프로파일은 이 파일 없이도 동작한다.
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: staysync-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-staysync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staysync}
      POSTGRES_DB: ${POSTGRES_DB:-staysync}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-staysync}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: staysync-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
