# Gradle 데몬과 그 자식 프로세스의 인코딩을 UTF-8 로 고정한다.
#
# 이 환경의 JVM 기본값은 MS949 다. 그대로 두면 Gradle 이 테스트 이름을 MS949 로
# 콘솔에 내보내 한국어 서술형 테스트 이름이 전부 깨져 읽을 수 없다.
# file.encoding 만으로는 부족하다. Java 19 부터 System.out 은 stdout.encoding 을
# 따로 보기 때문에 표준 출력·오류 인코딩을 함께 지정해야 한다.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
