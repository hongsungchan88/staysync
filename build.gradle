plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.staysync'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

// 배포용 jar 이름을 고정한다. deploy/app/Dockerfile 이 이 이름으로 COPY 한다.
bootJar {
    archiveFileName = 'staysync.jar'
    // 내장 PostgreSQL 바이너리 넷(81MB)은 local 프로파일 전용이다. 배포 jar 에서
    // 빼면 172MB → 91MB 다. 클래스(embedded-postgres-2.2.2.jar)는 남겨야 한다 —
    // EmbeddedPostgresConfig 가 참조하고, enabled=false 면 빈이 만들어지지 않을 뿐이다.
    classpath = sourceSets.main.runtimeClasspath.filter {
        !it.name.startsWith('embedded-postgres-binaries-')
    }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }

    // Mock OTA 시뮬레이터를 **별도 프로세스**로 띄우기 위한 클래스패스.
    //
    // testImplementation 으로 넣지 않는다. 그러면 시뮬레이터의 클래스와
    // application.yml 이 백엔드 테스트의 클래스패스에 섞인다 — classpath:/application.yml
    // 이 둘이 되어 어느 쪽이 읽힐지가 순서에 달리고, 시뮬레이터를 같은 JVM 에서 띄우면
    // 백엔드의 JPA·Flyway·Security 자동 설정이 그 컨텍스트에도 걸린다.
    //
    // 프로세스를 나누면 그런 얽힘이 없고, 무엇보다 12주차가 검증하려는 것이 실제 HTTP
    // 왕복과 타임아웃이라 같은 JVM 안의 호출로는 대신할 수 없다.
    mockOtaRuntime
}

repositories { mavenCentral() }

ext {
    set('springModulithVersion', '1.3.1')
}

dependencies {
    // 시뮬레이터는 별도 프로세스로만 쓴다. 컴파일에도 테스트 클래스패스에도 넣지 않는다.
    mockOtaRuntime project(':mock-ota-simulator')

    // --- 웹 / 영속성 / 검증 -------------------------------------------------
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // --- 모듈 경계 검증 -----------------------------------------------------
    implementation 'org.springframework.modulith:spring-modulith-starter-core'

    // --- 스키마 마이그레이션 -------------------------------------------------
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // --- 데이터베이스 --------------------------------------------------------
    runtimeOnly 'org.postgresql:postgresql'

    // local 프로파일: Docker 없이 실제 PostgreSQL 바이너리를 띄운다.
    // Windows 에서는 Microsoft Visual C++ 2013 재배포 패키지가 필요하다.
    implementation 'io.zonky.test:embedded-postgres:2.2.2'
    implementation platform('io.zonky.test.postgres:embedded-postgres-binaries-bom:16.4.0')

    // --- 인증 / 인가 (P1 3주차) ----------------------------------------------
    // JWT 발급과 검증은 Nimbus 를 쓰는 Spring Security 표준 경로로 처리한다.
    // 필터를 직접 짜지 않고 oauth2ResourceServer(jwt) 설정으로 끝낸다.
    // 근거는 docs/adr/0004-jwt-인증.md.
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // --- 결제 (P4 16주차) ----------------------------------------------------
    // 포트원 V2 서버 SDK. **웹훅 서명 검증을 직접 짜지 않기 위해 넣는다.**
    // 포트원 V2 웹훅은 Standard Webhooks 스펙이고 재생 공격 방지를 위한 타임스탬프
    // 허용 범위까지 규격에 들어 있다. HMAC 을 손으로 맞추면 그 부분이 빠지기 쉽고,
    // 빠져도 정상 웹훅은 전부 통과하므로 아무 증상이 없다.
    // 결제 재조회(금액 대조)도 이 SDK 로 한다.
    implementation 'io.portone:server-sdk:0.24.0'

    // --- 편의 --------------------------------------------------------------
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // --- P3 이후 추가 예정 ---------------------------------------------------
    // implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // implementation 'org.redisson:redisson-spring-boot-starter:3.35.0'
    // implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    // implementation 'org.mnode.ical4j:ical4j:4.0.6'
    // implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    // implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // --- P4(AI) 에서 추가 예정 ------------------------------------------------
    // implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    // implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // --- 테스트 ------------------------------------------------------------
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

/**
 * local 프로파일의 내장 PostgreSQL 데이터 디렉터리를 지운다.
 *
 * <p>P2 7주차에 clean-on-start 를 끄면서 실제로 쓰이는 태스크가 됐다. 데이터가 남으므로
 * 이미 적용된 마이그레이션을 고치면 Flyway 체크섬 오류로 기동이 막힌다. 그때, 또는
 * 개발용 데이터를 비우고 싶을 때 부른다.
 */
tasks.register('resetLocalDb') {
    group = 'application'
    description = 'local 프로파일 데이터베이스를 초기화한다'
    doLast {
        ['.localdb', '.localdb-test', '.localdb-api', '.localdb-relay', '.localdb-e2e',
            '.localdb-bulk'].each { name ->
            def dir = file(name)
            if (!dir.exists()) {
                return
            }
            if (!dir.deleteDir()) {
                throw new GradleException(
                    "${name} 를 지우지 못했습니다. 내장 PostgreSQL 이 아직 실행 중입니다.\n" +
                    "  1) IntelliJ 에서 실행 중인 애플리케이션을 정지하세요.\n" +
                    "  2) 남은 프로세스를 정리하세요.\n" +
                    "       Windows      Get-Process postgres -ErrorAction SilentlyContinue | Stop-Process -Force\n" +
                    "       macOS/Linux  pkill -f 'bin/postgres'\n" +
                    "  3) 다시 실행하세요.")
            }
            logger.lifecycle("${name} 삭제 완료")
        }
    }
}

// 소스는 UTF-8 인데 이 환경의 JVM 기본값은 MS949 다. 지정하지 않으면 javac 가
// 한국어 주석과 문자열 리터럴을 MS949 로 읽어 예외 메시지가 깨진 채 컴파일된다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    // 포크된 테스트 JVM 도 UTF-8 로 출력해야 한국어 테스트 이름이 읽힌다.
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'stdout.encoding', 'UTF-8'
    systemProperty 'stderr.encoding', 'UTF-8'
    // 테스트는 항상 빈 데이터베이스에서 시작한다.
    //
    // application-local.yml 의 clean-on-start 는 P2 7주차에 false 가 됐다. 앱은 재기동해도
    // 데이터가 남아야 하지만 테스트는 반대다. 남으면 행 수를 세는 검증이 실행할 때마다
    // 달라지고, Flyway 체크섬까지 얽힌다. 테스트 클래스마다 속성을 걸면 하나만 어긋나도
    // 컨텍스트 캐시 키가 갈려 내장 PostgreSQL 이 충돌하므로 여기서 한 번에 덮어쓴다.
    systemProperty 'staysync.embedded-postgres.clean-on-start', 'true'
    // Outbox 릴레이의 주기 실행을 테스트 내내 멈춘다.
    //
    // @EnableScheduling 이 켜져 있어 테스트 컨텍스트에서도 1초마다 돈다. 문제는 로그
    // 검증이다. Logback 로거는 JVM 전역이라 한 컨텍스트의 릴레이가 남긴 경고가 다른
    // 테스트의 appender 에 잡힌다. 예약 테스트들이 이벤트를 대량으로 만들면 그쪽 릴레이가
    // 진짜로 상한에 닿아 경고를 남기고, 그게 OutboxRelayTest 의 "경고가 없어야 한다"를
    // 깨뜨린다. 테스트 클래스마다 속성을 거는 대신 여기서 한 번에 끈다.
    systemProperty 'staysync.outbox.relay-interval-ms', '3600000'
    // 채널 동기화의 주기 실행도 같은 이유로 멈춘다.
    //
    // 버퍼 flush, 워커, 예약 폴링이 각각 1초마다 돌면 테스트가 직접 부르는 것과
    // 같은 대상을 두고 경쟁한다. "6초 안에 두 번 바꾸면 나중 값 하나만 나간다" 같은
    // 검증이 스케줄러가 사이에 끼어드는지에 따라 갈리고, 그건 가끔 실패하는 테스트가
    // 된다. 테스트는 flushAll(), drainOnce(), pollOnce() 를 직접 부른다.
    systemProperty 'staysync.channel.buffer-tick-ms', '3600000'
    systemProperty 'staysync.channel.worker-interval-ms', '3600000'
    systemProperty 'staysync.channel.poll-interval-ms', '3600000'
    // 시뮬레이터를 띄울 클래스패스를 넘긴다. 값을 실행 시점에 읽어야 설정 단계에서
    // 의존성이 해석되지 않는다.
    def mockOta = configurations.mockOtaRuntime
    dependsOn ':mock-ota-simulator:jar'
    doFirst {
        systemProperty 'staysync.test.mock-ota-classpath', mockOta.asPath
    }

    // 동시성 테스트는 시간이 걸리므로 기본 실행에 포함하되 로그를 남긴다.
    testLogging { events 'passed', 'skipped', 'failed' }
}
